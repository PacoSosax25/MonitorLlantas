server.port=8080

# Datasource — lee variable de entorno; si no existe, usa el valor por defecto
spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# HikariCP pool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
# DB_IDLE_TIME en minutos; HikariCP requiere milisegundos (default: 2 min = 120000 ms)
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=30000

# Sesion: 1 hora de inactividad
server.servlet.session.timeout=1h

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
