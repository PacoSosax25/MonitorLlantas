<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Llantas - Inicio de Sesion</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">Monitor de Llantas</h1>
            <p class="login-subtitle">Ingrese sus credenciales</p>

            <div th:if="${error}" class="alert-error" th:text="${error}"></div>

            <form th:action="@{/login}" method="post" class="login-form">
                <div class="form-group">
                    <label for="nombre">Usuario</label>
                    <input type="text" id="nombre" name="nombre" required autofocus placeholder="Usuario">
                </div>
                <div class="form-group">
                    <label for="pass">Contrasena</label>
                    <input type="password" id="pass" name="pass" required placeholder="Contrasena">
                </div>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
        </div>
    </div>

</body>
</html>
